# Container-only Backstage instance (dev mode: `pnpm start`, both frontend
# dev server on :3000 and backend on :7007) -- deliberately, so nothing
# depends on whatever Node/pnpm/corepack setup happens to exist on the
# host machine.
#
# Datastore choice: SQLite (better-sqlite3), per app-config.yaml's default
# `backend.database` block. This is a prototype/demo repo, not
# a production deployment — Postgres is unnecessary complexity for local development.
#
# Required environment variables (export these before `docker compose up`):
#   MODHUB_API_BASE_URL     API endpoint from AWS infrastructure (from personal env)
#   MODHUB_NOTIFICATIONS_QUEUE_URL  SQS queue URL from AWS infrastructure
#   MODHUB_AWS_REGION       AWS region (e.g., us-east-2)
#   AUTH_SESSION_SECRET     Secret key for session management
#   AUTH_OIDC_METADATA_URL  Cognito discovery URL endpoint
#   AUTH_OIDC_CLIENT_ID     Cognito backstage client ID
#   AUTH_OIDC_CLIENT_SECRET Cognito backstage client secret
services:
  backstage:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: engineering-modernization-hub/backstage:local
    container_name: modhub-backstage
    ports:
      - '3000:3000'
      - '7007:7007'
    environment:
      # Frontend dev server binding
      HOST: '0.0.0.0'
      # AWS infrastructure configuration
      MODHUB_API_BASE_URL: ${MODHUB_API_BASE_URL:-}
      MODHUB_NOTIFICATIONS_QUEUE_URL: ${MODHUB_NOTIFICATIONS_QUEUE_URL:-}
      MODHUB_AWS_REGION: ${MODHUB_AWS_REGION:-}
      # Authentication configuration
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_OIDC_METADATA_URL: ${AUTH_OIDC_METADATA_URL:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Note: app-config.yaml's default `backend.database.connection` is
    # `:memory:`, so catalog/scaffolder state does not survive a container
    # restart. Modify app-config.yaml to use a persistent database if needed.
