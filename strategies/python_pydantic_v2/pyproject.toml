[project]
name = "python-pydantic-v2"
version = "0.1.0"
description = "Strategy manifest: Pydantic v1 -> v2 migration"
requires-python = ">=3.14,<3.15"
dependencies = [
    "strategies-sdk",
    "core-py",
]

[tool.uv.sources]
strategies-sdk = { workspace = true }
core-py = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_pydantic_v2"]
