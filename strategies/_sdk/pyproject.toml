[project]
name = "strategies-sdk"
version = "0.1.0"
description = "Strategy Protocol, manifest schema and limit-validation SDK for the strategy contribution surface"
requires-python = ">=3.14,<3.15"
dependencies = [
    "core-py",
    "pydantic>=2.7",
]

[tool.uv.sources]
core-py = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategies_sdk"]
