[project]
name = "core-py"
version = "0.1.0"
description = "Shared Pydantic models, DynamoDB access layer and pricing table for the Engineering Modernization Hub"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_py"]
