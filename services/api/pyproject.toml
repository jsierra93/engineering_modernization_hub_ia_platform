[project]
name = "api"
version = "0.1.0"
description = "lambda api -- 11 routes under /modhub/v1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "core-py",
    "boto3>=1.34",
]

[tool.uv.sources]
core-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
