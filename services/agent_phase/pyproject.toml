[project]
name = "agent-phase"
version = "0.1.0"
description = "lambda agent_phase -- Strands + Bedrock, one phase per invocation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "strands-agents>=1.57",
    "pydantic>=2.7",
    "boto3>=1.34",
    "core-py",
    "strategies-sdk",
    "fetch-doc",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb,s3]>=5.0",
]

[tool.uv.sources]
core-py = { workspace = true }
strategies-sdk = { workspace = true }
fetch-doc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_phase"]
