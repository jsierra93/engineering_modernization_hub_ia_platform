[project]
name = "engineering-modernization-hub"
version = "0.1.0"
description = "Engineering Modernization Hub -- workspace root (Python side)"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = [
    "services/*",
    "strategies/*",
    "packages/*",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,s3,stepfunctions]>=5.0",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

